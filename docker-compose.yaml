# Evolution GO — local-mode fork (no telemetry, no license server).
# Deploy target: Coolify (Docker Compose build pack — Coolify clones the repo
# and builds the image from ./Dockerfile).
#
# Coolify "magic" env vars do the wiring for you:
#   SERVICE_FQDN_EVOLUTIONGO_8080  -> marks this service's port 8080 as the HTTP
#                                     endpoint to proxy. Set the actual domain
#                                     (evolution.medeiroz.com) in the Coolify UI:
#                                     Service -> evolution-go -> Domains. Point
#                                     that domain's DNS at the Coolify server.
#   ${SERVICE_PASSWORD_64_APIKEY}  -> a persistent 64-char API key (no symbols).
#
# DATABASE: Postgres is a SEPARATE Coolify-MANAGED database (standalone
# resource `evolution-go-postgres`, uuid rmuon5lug96hpx0uerincy3h), NOT part of
# this compose. That gives it the Coolify backup UI + a public port. This app
# reaches it by container name over Coolify's predefined network, so the app
# MUST have "Connect To Predefined Network" enabled (Configuration -> Advanced).
#   ${MANAGED_PG_PASSWORD}  -> the managed Postgres password (set in Coolify env,
#                              kept out of git).
#
# NOTE: `environment` uses the MAP form (key: value), not the list form
# (- KEY=value). Coolify rewrites the compose and its YAML parser chokes on the
# list form ("non-string key ... environment: 0"), so keep it as a map and quote
# every value as a string.
#
# Local test run: `docker compose up` reads the secrets from a local .env
# (gitignored) — see DEPLOY-COOLIFY.md.

services:
  evolution-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 0.7.2-local
    restart: unless-stopped
    environment:
      # Coolify: mark port 8080 as the HTTP endpoint to route (domain set in UI)
      SERVICE_FQDN_EVOLUTIONGO_8080: ""
      SERVER_PORT: "8080"
      # Security: master API key (send as the "apikey" header)
      GLOBAL_API_KEY: "${SERVICE_PASSWORD_64_APIKEY}"
      # Database (Coolify-managed Postgres, reached by container name over the
      # predefined network — see header note)
      POSTGRES_AUTH_DB: "postgresql://postgres:${MANAGED_PG_PASSWORD}@rmuon5lug96hpx0uerincy3h:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${MANAGED_PG_PASSWORD}@rmuon5lug96hpx0uerincy3h:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      # Runtime
      CLIENT_NAME: "evolution"
      OS_NAME: "Evolution GO"
      CONNECT_ON_STARTUP: "false"
      GIN_MODE: "release"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      WEBHOOK_FILES: "true"
      MINIO_ENABLED: "false"
      # AMQP: firehose global de eventos de TODAS as instâncias -> RabbitMQ
      # (service `rabbitmq-evolution-go`, uuid m9jkqoqkkc8q8ijslc3npmf2). O app
      # alcança o broker pelo nome do container na rede predefinida `coolify`
      # (o service precisa de "Connect To Predefined Network" ligado). Cria filas
      # `message` (recebidas) e `sendmessage` (enviadas), durable + quorum. A URL
      # com credenciais fica na env AMQP_URL do Coolify (fora do git).
      AMQP_GLOBAL_ENABLED: "true"
      AMQP_GLOBAL_EVENTS: "MESSAGE,SEND_MESSAGE"
      AMQP_URL: "${AMQP_URL}"
      # Passkey pairing: public URL of THIS API (used only if WhatsApp asks)
      PASSKEY_PUBLIC_URL: "https://evolution.medeiroz.com"
    expose:
      - "8080"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/manager"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

volumes:
  evolution_data:
  evolution_logs:
