# Evolution GO — local-mode fork (no telemetry, no license server).
# Deploy target: Coolify (Docker Compose build pack — Coolify clones the repo
# and builds the image from ./Dockerfile).
#
# Coolify "magic" env vars do the wiring for you:
#   SERVICE_FQDN_EVOLUTIONGO_8080  -> marks this service's port 8080 as the HTTP
#                                     endpoint to proxy. Set the actual domain
#                                     (evolution.medeiroz.com) in the Coolify UI:
#                                     Service -> evolution-go -> Domains. Point
#                                     that domain's DNS at the Coolify server.
#   ${SERVICE_PASSWORD_64_APIKEY}  -> a persistent 64-char API key (no symbols).
#   ${SERVICE_PASSWORD_PG}         -> a persistent Postgres password.
# The two SERVICE_PASSWORD_* are generated once and stay editable in the UI.
#
# NOTE: `environment` uses the MAP form (key: value), not the list form
# (- KEY=value). Coolify rewrites the compose and its YAML parser chokes on the
# list form ("non-string key ... environment: 0"), so keep it as a map and quote
# every value as a string.
#
# Local test run: `docker compose up` reads the secrets from a local .env
# (gitignored) — see DEPLOY-COOLIFY.md. Postgres is INTERNAL — no host port.

services:
  evolution-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: 0.7.2-local
    restart: unless-stopped
    environment:
      # Coolify: mark port 8080 as the HTTP endpoint to route (domain set in UI)
      SERVICE_FQDN_EVOLUTIONGO_8080: ""
      SERVER_PORT: "8080"
      # Security: master API key (send as the "apikey" header)
      GLOBAL_API_KEY: "${SERVICE_PASSWORD_64_APIKEY}"
      # Database (Postgres over the internal network)
      POSTGRES_AUTH_DB: "postgresql://postgres:${SERVICE_PASSWORD_PG}@postgres:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${SERVICE_PASSWORD_PG}@postgres:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      # Runtime
      CLIENT_NAME: "evolution"
      OS_NAME: "Evolution GO"
      CONNECT_ON_STARTUP: "false"
      GIN_MODE: "release"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      WEBHOOK_FILES: "true"
      MINIO_ENABLED: "false"
      AMQP_GLOBAL_ENABLED: "false"
      # Passkey pairing: public URL of THIS API (used only if WhatsApp asks)
      PASSKEY_PUBLIC_URL: "https://evolution.medeiroz.com"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/manager"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_PG}"
      POSTGRES_DB: "postgres"
    volumes:
      # PG18 moved PGDATA under /var/lib/postgresql/<major>/docker and declares
      # the volume at /var/lib/postgresql — mount the whole dir, NOT .../data
      # (mounting .../data here would silently fail to persist on PG18).
      - postgres_data:/var/lib/postgresql
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  evolution_data:
  evolution_logs:
  postgres_data:
