<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grupos Monitorados — Evolution GO Manager</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --fg: #0f172a;
      --muted: #64748b; --accent: #16a34a; --accent-fg: #ffffff;
      --danger: #dc2626; --chip: #f1f5f9; --warn-bg: #fffbeb; --warn-br: #fcd34d; --warn-fg: #92400e;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    }
    html.dark {
      --bg: #0b1220; --card: #111a2e; --border: #1e293b; --fg: #e2e8f0;
      --muted: #94a3b8; --accent: #22c55e; --accent-fg: #04120a;
      --danger: #f87171; --chip: #1e293b; --warn-bg: #2a220a; --warn-br: #a16207; --warn-fg: #fde68a;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    a { color: inherit; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
    header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    header.top .back {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      color: var(--muted); font-weight: 500; padding: 6px 10px; border-radius: 8px;
    }
    header.top .back:hover { background: var(--chip); color: var(--fg); }
    h1 { font-size: 20px; margin: 0; font-weight: 700; }
    .sub { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
    }
    label.field { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    select, input[type=text] {
      width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px;
      background: var(--bg); color: var(--fg); font: inherit; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .row > .grow { flex: 1 1 220px; }
    button {
      font: inherit; font-weight: 600; cursor: pointer; border: 1px solid transparent;
      border-radius: 9px; padding: 9px 14px; background: var(--accent); color: var(--accent-fg);
    }
    button:hover { filter: brightness(1.05); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.ghost { background: transparent; color: var(--muted); border-color: var(--border); }
    button.ghost:hover { color: var(--fg); background: var(--chip); }
    button.icon-danger {
      background: transparent; color: var(--danger); border-color: var(--border);
      padding: 6px 10px; font-size: 13px;
    }
    button.icon-danger:hover { background: rgba(220,38,38,.08); }
    .banner {
      border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-bottom: 14px;
      background: var(--warn-bg); border: 1px solid var(--warn-br); color: var(--warn-fg);
    }
    .banner.info { background: var(--chip); border-color: var(--border); color: var(--muted); }
    .list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .grp {
      display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border: 1px solid var(--border); border-radius: 10px; background: var(--bg);
    }
    .grp.monitored { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--bg)); }
    .grp .name { font-weight: 600; }
    .grp .jid { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .grp .meta { flex: 1 1 auto; min-width: 0; }
    .grp .badge {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
      color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px;
    }
    .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .toggle input { width: 40px; height: 22px; appearance: none; background: var(--border); border-radius: 999px; position: relative; cursor: pointer; transition: background .15s; flex: 0 0 auto; }
    .toggle input:checked { background: var(--accent); }
    .toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .toggle input:checked::after { left: 20px; }
    .muted { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); padding: 24px 8px; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -3px; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px;
      font-weight: 600; font-size: 13px; box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: opacity .2s; z-index: 50;
    }
    .toast.show { opacity: 1; }
    .toast.err { background: var(--danger); color: #fff; }
    .searchbar { margin: 10px 0 2px; }
    details.manual { margin-top: 12px; }
    details.manual summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 13px; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="back" href="/manager" title="Voltar ao manager">&larr; Manager</a>
      <div>
        <h1>Grupos Monitorados</h1>
        <p class="sub">Escolha quais grupos de cada instância são capturados para análise.</p>
      </div>
    </header>

    <div class="card">
      <label class="field" for="instance">Instância</label>
      <div class="row">
        <div class="grow">
          <select id="instance"><option value="">Carregando…</option></select>
        </div>
        <button id="reload" class="ghost" title="Recarregar grupos">Recarregar</button>
      </div>
      <p class="hint" id="instanceHint"></p>
    </div>

    <div id="content"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    "use strict";

    // ---- auth (reuse the manager's stored session) ----
    function getAuth() {
      try {
        var raw = localStorage.getItem("evolution-auth");
        if (!raw) return null;
        var obj = JSON.parse(raw);
        var st = obj.state || obj;
        if (!st || !st.apiKey) return null;
        return { apiUrl: st.apiUrl || "", apiKey: st.apiKey };
      } catch (e) { return null; }
    }
    var auth = getAuth();
    if (!auth) { location.href = "/manager/login"; return; }
    var BASE = (auth.apiUrl || "").replace(/\/+$/, "");

    // theme, matching the manager
    if (localStorage.getItem("evolution-theme") === "dark") {
      document.documentElement.classList.add("dark");
    }

    // ---- tiny api helper ----
    function api(path, opts) {
      opts = opts || {};
      var headers = { apikey: opts.apikey || auth.apiKey };
      if (opts.body !== undefined) headers["Content-Type"] = "application/json";
      return fetch(BASE + path, {
        method: opts.method || "GET",
        headers: headers,
        body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        cache: "no-store"
      }).then(function (r) {
        return r.text().then(function (t) {
          var data = null;
          try { data = t ? JSON.parse(t) : null; } catch (e) {}
          if (!r.ok) {
            var msg = (data && (data.error || data.message)) || ("HTTP " + r.status);
            throw new Error(msg);
          }
          return data;
        });
      });
    }

    var $ = function (id) { return document.getElementById(id); };
    var content = $("content");
    var instanceSel = $("instance");
    var instanceHint = $("instanceHint");

    var toastT;
    function toast(msg, isErr) {
      var el = $("toast");
      el.textContent = msg;
      el.className = "toast show" + (isErr ? " err" : "");
      clearTimeout(toastT);
      toastT = setTimeout(function () { el.className = "toast"; }, 2600);
    }

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    // whatsmeow GroupInfo shapes vary — parse defensively.
    function jidOf(g) {
      var j = g && (g.JID || g.jid || g.Jid);
      if (!j) return "";
      if (typeof j === "string") return j;
      if (typeof j === "object" && j.User) return j.User + "@" + (j.Server || "g.us");
      return "";
    }
    function nameOf(g) {
      return (g && (g.Name || g.name ||
        (g.GroupName && (g.GroupName.Name || g.GroupName.name)) ||
        g.groupName || g.Subject || g.subject)) || "";
    }

    var instances = {}; // id -> {id, name, token}
    var state = { instanceId: "", groups: [], monitored: {} };

    // ---- load instances ----
    function loadInstances() {
      return api("/instance/all").then(function (res) {
        var list = (res && res.data) || res || [];
        instances = {};
        instanceSel.innerHTML = "";
        if (!list.length) {
          instanceSel.innerHTML = '<option value="">Nenhuma instância</option>';
          return;
        }
        var last = localStorage.getItem("mg-last-instance") || "";
        list.forEach(function (i) {
          instances[i.id] = { id: i.id, name: i.name, token: i.token };
          var opt = document.createElement("option");
          opt.value = i.id;
          opt.textContent = i.name + (i.name === i.id ? "" : "");
          instanceSel.appendChild(opt);
        });
        var chosen = instances[last] ? last : list[0].id;
        instanceSel.value = chosen;
        state.instanceId = chosen;
        return loadForInstance();
      });
    }

    // ---- load monitored + joined groups for the selected instance ----
    function loadForInstance() {
      var id = state.instanceId;
      if (!id) { content.innerHTML = ""; return Promise.resolve(); }
      localStorage.setItem("mg-last-instance", id);
      content.innerHTML = '<div class="card"><div class="empty"><span class="spinner"></span> Carregando grupos…</div></div>';

      var monitoredP = api("/instance/monitored-groups/" + id)
        .then(function (res) { return (res && res.data) || []; })
        .catch(function () { return []; });

      var token = instances[id] && instances[id].token;
      var groupsP = token
        ? api("/group/list", { apikey: token })
            .then(function (res) { return { ok: true, data: (res && res.data) || res || [] }; })
            .catch(function (e) { return { ok: false, err: e.message }; })
        : Promise.resolve({ ok: false, err: "instância sem token" });

      return Promise.all([monitoredP, groupsP]).then(function (r) {
        var monitoredList = r[0], groupsRes = r[1];
        state.monitored = {};
        monitoredList.forEach(function (m) { state.monitored[m.group_jid] = m; });

        var joined = [];
        if (groupsRes.ok) {
          (groupsRes.data || []).forEach(function (g) {
            var jid = jidOf(g);
            if (jid) joined.push({ jid: jid, name: nameOf(g) });
          });
          joined.sort(function (a, b) { return (a.name || a.jid).localeCompare(b.name || b.jid); });
        }
        state.groups = joined;
        state.groupsError = groupsRes.ok ? "" : groupsRes.err;
        render();
      });
    }

    function monitoredCount() { return Object.keys(state.monitored).length; }

    function render() {
      var html = "";
      var count = monitoredCount();

      if (count === 0) {
        html += '<div class="banner">⚠️ <b>Nenhum grupo cadastrado</b> — no momento <b>todos</b> os grupos desta instância são monitorados. ' +
                'Ao ativar o primeiro grupo, a instância passa a monitorar <b>apenas</b> os grupos marcados.</div>';
      } else {
        html += '<div class="banner info">Monitorando <b>apenas</b> os ' + count + ' grupo(s) marcado(s). Os demais grupos desta instância são ignorados.</div>';
      }

      // joined-group picker (progressive enhancement)
      html += '<div class="card">';
      if (state.groups.length) {
        html += '<label class="field">Grupos da instância</label>';
        html += '<input type="text" id="search" class="searchbar" placeholder="Filtrar por nome ou JID…" autocomplete="off">';
        html += '<div class="list" id="grouplist"></div>';
      } else {
        html += '<label class="field">Grupos da instância</label>';
        if (state.groupsError) {
          html += '<div class="empty">Não foi possível listar os grupos automaticamente (' + esc(state.groupsError) + ').<br>' +
                  'Verifique se a instância está conectada, ou cadastre o JID manualmente abaixo.</div>';
        } else {
          html += '<div class="empty">Esta instância não participa de nenhum grupo.</div>';
        }
      }

      // manual add — always available fallback
      html += '<details class="manual"' + (state.groups.length ? "" : " open") + '>' +
              '<summary>Adicionar grupo manualmente (por JID)</summary>' +
              '<div class="row" style="margin-top:10px">' +
              '<div class="grow"><input type="text" id="mJid" placeholder="1203630...@g.us"></div>' +
              '<div class="grow"><input type="text" id="mName" placeholder="Nome (opcional)"></div>' +
              '<button id="mAdd">Adicionar</button>' +
              '</div>' +
              '<p class="hint">O JID aparece em <code>raw_messages.chat_jid</code> (os terminados em <code>@g.us</code>).</p>' +
              '</details>';
      html += "</div>";

      content.innerHTML = html;

      if (state.groups.length) {
        renderGroupList("");
        var search = $("search");
        search.addEventListener("input", function () { renderGroupList(search.value.trim().toLowerCase()); });
      }
      var mAdd = $("mAdd");
      if (mAdd) mAdd.addEventListener("click", manualAdd);
    }

    function renderGroupList(filter) {
      var box = $("grouplist");
      if (!box) return;
      var rows = state.groups.filter(function (g) {
        if (!filter) return true;
        return (g.name || "").toLowerCase().indexOf(filter) >= 0 || g.jid.toLowerCase().indexOf(filter) >= 0;
      });
      if (!rows.length) { box.innerHTML = '<div class="empty">Nenhum grupo corresponde ao filtro.</div>'; return; }
      box.innerHTML = rows.map(function (g) {
        var on = !!state.monitored[g.jid];
        return '<div class="grp' + (on ? " monitored" : "") + '">' +
          '<div class="meta">' +
            '<div class="name">' + esc(g.name || "(sem nome)") + (on ? ' <span class="badge">on</span>' : "") + '</div>' +
            '<div class="jid">' + esc(g.jid) + '</div>' +
          '</div>' +
          '<label class="toggle"><input type="checkbox" data-jid="' + esc(g.jid) + '" data-name="' + esc(g.name) + '"' + (on ? " checked" : "") + '></label>' +
        '</div>';
      }).join("");
      Array.prototype.forEach.call(box.querySelectorAll('input[type=checkbox]'), function (cb) {
        cb.addEventListener("change", function () { onToggle(cb); });
      });
    }

    function onToggle(cb) {
      var jid = cb.getAttribute("data-jid");
      var name = cb.getAttribute("data-name") || "";
      cb.disabled = true;
      var p = cb.checked
        ? api("/instance/monitored-groups/" + state.instanceId, { method: "POST", body: { group_jid: jid, name: name } })
        : api("/instance/monitored-groups/" + state.instanceId, { method: "DELETE", body: { group_jid: jid } });
      p.then(function () {
        if (cb.checked) state.monitored[jid] = { group_jid: jid, name: name };
        else delete state.monitored[jid];
        toast(cb.checked ? "Grupo adicionado" : "Grupo removido");
        render(); // re-render to refresh banner + counts + monitored styling
      }).catch(function (e) {
        cb.checked = !cb.checked;
        cb.disabled = false;
        toast(e.message, true);
      });
    }

    function manualAdd() {
      var jid = ($("mJid").value || "").trim();
      var name = ($("mName").value || "").trim();
      if (!jid) { toast("Informe o JID do grupo", true); return; }
      if (jid.indexOf("@") < 0) jid += "@g.us";
      var btn = $("mAdd");
      btn.disabled = true;
      api("/instance/monitored-groups/" + state.instanceId, { method: "POST", body: { group_jid: jid, name: name } })
        .then(function () {
          state.monitored[jid] = { group_jid: jid, name: name };
          toast("Grupo adicionado");
          return loadForInstance();
        })
        .catch(function (e) { toast(e.message, true); btn.disabled = false; });
    }

    instanceSel.addEventListener("change", function () {
      state.instanceId = instanceSel.value;
      var inst = instances[state.instanceId];
      instanceHint.textContent = inst && inst.token ? "" : "Instância sem token — a lista automática de grupos ficará indisponível.";
      loadForInstance();
    });
    $("reload").addEventListener("click", function () { loadForInstance(); });

    loadInstances().catch(function (e) {
      content.innerHTML = '<div class="card"><div class="empty">Falha ao carregar instâncias: ' + esc(e.message) +
        '<br><br><button class="ghost" onclick="location.href=\'/manager/login\'">Ir para o login</button></div></div>';
    });
  })();
  </script>
</body>
</html>
